<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" font-family="'Share Tech Mono','Cascadia Mono','Consolas',monospace">
  <defs>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#1a472a"/>
      <stop offset="1" stop-color="#8fbf9f"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- window -->
  <rect x="1" y="1" width="638" height="298" rx="12" fill="#0a0f0c" stroke="#1a472a" stroke-width="2"/>
  <rect x="1" y="1" width="638" height="34" rx="12" fill="#0d2416"/>
  <rect x="1" y="24" width="638" height="11" fill="#0d2416"/>
  <circle cx="24" cy="18" r="6" fill="#5d7a68"/>
  <circle cx="44" cy="18" r="6" fill="#2e8b57"/>
  <circle cx="64" cy="18" r="6" fill="#8fbf9f"/>
  <text x="320" y="23" text-anchor="middle" font-size="13" fill="#a8b3ac">alaa@slytherin: ~/sign-language-ai</text>

  <g font-size="16">
    <!-- line 1 -->
    <text x="24" y="70" fill="#8fbf9f" opacity="0">$ python train.py --house slytherin
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.02;0.03;0.94;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <!-- line 2 -->
    <text x="24" y="100" fill="#c9ced1" opacity="0">loading dataset of hand signs... done 🤟
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.12;0.13;0.94;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <!-- line 3 -->
    <text x="24" y="130" fill="#c9ced1" opacity="0">training model 🐍
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.22;0.23;0.94;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <!-- progress bar -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.22;0.23;0.94;1" dur="12s" repeatCount="indefinite"/>
      <rect x="200" y="117" width="300" height="16" rx="8" fill="#141a16" stroke="#1a472a"/>
      <rect x="200" y="117" width="0" height="16" rx="8" fill="url(#bar)">
        <animate attributeName="width" values="0;0;300;300;0" keyTimes="0;0.23;0.55;0.94;1" dur="12s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- line 4 -->
    <text x="24" y="160" fill="#c9ced1" opacity="0">loss: 0.69 → 0.04   (we don't talk about epoch 1)
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.58;0.59;0.94;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <!-- line 5 -->
    <text x="24" y="190" fill="#c9ced1" opacity="0">accuracy: high · vibes: immaculate ✨
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.68;0.69;0.94;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <!-- line 6 -->
    <text x="24" y="230" fill="#8fbf9f" filter="url(#glow)" opacity="0">✔ model ready. mischief managed 🖤
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.78;0.79;0.94;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <!-- prompt + blinking cursor -->
    <text x="24" y="266" fill="#8fbf9f" opacity="0">$
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.84;0.85;0.94;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <rect x="42" y="253" width="10" height="17" fill="#8fbf9f" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
